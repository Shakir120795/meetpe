name: Validate Customer UI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify legacy UI stylesheet injection is absent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          if '/ui-v5.css?v=5' in s:
              raise SystemExit("Legacy /ui-v5.css link is still present in public/index.html")
          print("OK: public/index.html does not reference /ui-v5.css?v=5")
          PY
