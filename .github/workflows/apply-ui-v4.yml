name: Apply UI v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-ui:
    if: ${{ !contains(github.event.head_commit.message, 'Apply UI v4') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UI v4 stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<link rel="stylesheet" href="/ui-v4.css?v=4">'
          if 'href="/ui-v4.css?v=4"' not in s:
              marker = '</style>'
              if marker not in s:
                  raise SystemExit('index.html: closing style tag not found')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI v4 injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet || git commit -m "Apply UI v4 stylesheet"
          git push