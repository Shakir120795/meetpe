<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Banner & Category Management</title>
<link rel="icon" type="image/png" href="/logo.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f3f4f6;color:#1a1a1a;padding:20px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:24px;margin-bottom:6px}
.sub{color:#6b7280;margin-bottom:18px;font-size:14px}
.nav-links{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.nav-links a{padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb}
.nav-links a:hover{color:#d62828;border-color:#d62828}
.nav-links a.active{background:#d62828;color:white;border-color:#d62828}
.section{background:white;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.section h2{font-size:18px;margin-bottom:12px;color:#d62828}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px}
.field input[type="color"]{padding:4px;cursor:pointer;height:40px}
.field input[type="file"]{padding:6px;cursor:pointer}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.card-header{display:flex;justify-content:between;align-items:center;margin-bottom:12px}
.card-title{font-weight:700;color:#374151}
.card-actions{display:flex;gap:8px;align-items:center}
.btn-save{padding:12px 24px;background:#16a34a;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
.btn-add{padding:8px 16px;background:#d62828;color:white;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-del{padding:4px 10px;background:#fee2e2;color:#ef4444;border:none;border-radius:6px;font-size:12px;cursor:pointer}
.toggle{position:relative;display:inline-block;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;border-radius:24px;transition:.3s}
.toggle .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;border-radius:50%;transition:.3s}
.toggle input:checked + .slider{background-color:#d62828}
.toggle input:checked + .slider:before{transform:translateX(20px)}
.preview{margin-top:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:12px}
.preview-banner{height:80px;border-radius:8px;padding:12px;color:white;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.preview-hero{height:120px;border-radius:12px;padding:16px;color:white;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));gap:12px;margin-top:12px}
.category-preview{display:flex;flex-direction:column;align-items:center;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:white}
.cat-icon-preview{width:48px;height:48px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;margin-bottom:4px;font-size:24px;border:2px solid #e5e7eb}
.cat-name-preview{font-size:11px;font-weight:600;text-align:center}
#content{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🎨 Banner & Category Management</h1>
<p class="sub">Manage hero banners, offer banners, and product categories. Changes reflect instantly on app.</p>
<div class="nav-links">
<a href="/skrdashboard.html">📊 Dashboard</a>
<a href="/skrorders.html">📋 Orders</a>
<a href="/skritems.html">🍗 Items</a>
<a href="/skrbanners.html" class="active">🎨 Banners</a>
<a href="/skrsettings.html">⚙️ Settings</a>
</div>
<div style="background:white;padding:14px 16px;border-radius:12px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.04)">
<input id="key" type="password" placeholder="Admin key" style="flex:1;min-width:200px;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px"/>
<button onclick="loadData()" style="padding:9px 18px;background:#d62828;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer">Load</button>
</div>
<div id="content">

<!-- Hero Banner Slideshow -->
<div class="section">
<h2>🖼️ Hero Banner Slideshow</h2>
<div class="field">
  <label>Slideshow Enabled</label>
  <select id="heroSlideshowEnabled">
    <option value="true">Yes - Show Slideshow</option>
    <option value="false">No - Hide Slideshow</option>
  </select>
</div>
<div class="field-row">
  <div class="field">
    <label>Auto-play Speed (seconds)</label>
    <input id="heroAutoplaySpeed" type="number" value="4" min="2" max="10"/>
  </div>
  <div class="field">
    <label>Height (px)</label>
    <input id="heroHeight" type="number" value="200" min="120" max="300"/>
  </div>
</div>
<div id="heroSlidesList"></div>
<button class="btn-add" onclick="addHeroSlide()">➕ Add Slide</button>
<div class="preview">
  <strong>Preview:</strong>
  <div id="heroPreview"></div>
</div>
</div>

<!-- Offer Banners -->
<div class="section">
<h2>🏷️ Offer Banners</h2>
<div class="field">
  <label>Offer Banners Enabled</label>
  <select id="offerBannersEnabled">
    <option value="true">Yes - Show Banners</option>
    <option value="false">No - Hide Banners</option>
  </select>
</div>
<div id="offerBannersList"></div>
<button class="btn-add" onclick="addOfferBanner()">➕ Add Banner</button>
<div class="preview">
  <strong>Preview:</strong>
  <div id="offerPreview"></div>
</div>
</div>

<!-- Categories -->
<div class="section">
<h2>📂 Product Categories</h2>
<div id="categoriesList"></div>
<button class="btn-add" onclick="addCategory()">➕ Add Category</button>
<div class="preview">
  <strong>Categories Preview:</strong>
  <div class="category-grid" id="categoryPreview"></div>
</div>
</div>

<button class="btn-save" onclick="saveAll()">💾 Save All Changes</button>
</div>
</div>
<script>

// Auto-inject x-admin-key header for all /admin and /api/upload requests
const _origFetch = window.fetch.bind(window);
window.fetch = function(url, options = {}) {
  const urlStr = typeof url === 'string' ? url : (url?.url || '');
  if (urlStr.startsWith('/admin') || urlStr.startsWith('/api/upload')) {
    const adminKey = localStorage.getItem('meatpe_admin_key') || '';
    options = options || {};
    options.headers = { ...(options.headers || {}), 'x-admin-key': adminKey };
  }
  return _origFetch(url, options);
};

const $ = id => document.getElementById(id);
let SETTINGS = null;
const saved = localStorage.getItem('meatpe_admin_key');
if (saved) { $('key').value = saved; loadData(); }
function getKey() { const k = $('key').value.trim(); localStorage.setItem('meatpe_admin_key', k); return k; }

// Mock data for testing when backend is not available
const MOCK_SETTINGS = {
  banners: {
    heroSlideshow: {
      enabled: true,
      autoplaySpeed: 4,
      height: 220,
      slides: [
        {
          title1: 'Farm Fresh Meat,',
          title2: 'Delivered to You',
          badge: '100% GUARANTEED',
          buttonText: 'Order Now →',
          subtitle: 'Halal • Hygienic • Trusted',
          subtitle2: 'AI ensures best quality',
          features: ['⚡ 15 Min Delivery', '❄️ Sub-Zero Cold Chain', '✅ 100% Halal Certified', '🚫 No Added Hormones'],
          backgroundColor: '#FFFFFF',
          textColor: '#1A1A1A',
          badgeColor: '#E63946',
          buttonColor: '#E63946',
          subtitleColor: '#6B7280',
          qualityBadgeColor: '#10B981',
          height: 220,
          titleSize: 24,
          subtitleSize: 14,
          buttonSize: 15,
          imageWidth: 180,
          imageHeight: 180,
          image: '/photos/meat-stack.jpg',
          qualityBadgeText: '99.4% Excellent',
          enabled: true
        }
      ]
    },
    offerBanners: {
      enabled: true,
      banners: [
        {
          label: 'Free Delivery',
          title: 'On orders above',
          subtitle: '₹499',
          backgroundColor: '#10B981',
          textColor: '#FFFFFF',
          icon: '🛵',
          image: '',
          imageSize: 60,
          width: 280,
          height: 100,
          iconSize: 28,
          labelSize: 10,
          titleSize: 16,
          subtitleSize: 12,
          enabled: true
        },
        {
          label: 'First Order Offer',
          title: 'Flat 20% OFF',
          subtitle: 'Use Code: NOW20',
          backgroundColor: '#F59E0B',
          textColor: '#FFFFFF',
          icon: '🥩',
          image: '',
          imageSize: 60,
          width: 280,
          height: 100,
          iconSize: 28,
          labelSize: 10,
          titleSize: 16,
          subtitleSize: 12,
          enabled: true
        }
      ]
    }
  },
  categories: [
    { id: 'chicken', name: 'Chicken', icon: '🐔', image: '', size: 64, labelSize: 13, activeColor: '#E63946', order: 1, enabled: true },
    { id: 'mutton', name: 'Mutton', icon: '🐐', image: '', size: 64, labelSize: 13, activeColor: '#E63946', order: 2, enabled: true },
    { id: 'fish', name: 'Fish', icon: '🐟', image: '', size: 64, labelSize: 13, activeColor: '#E63946', order: 3, enabled: true }
  ]
};

async function loadData() {
  const key = getKey();
  if (!key) {
    alert('Please enter admin key first');
    return;
  }
  
  try {
    const res = await fetch('/admin/settings', {
      headers: { 'x-admin-key': key }
    });
    
    if (res.ok) {
      const data = await res.json();
      if (data.ok) {
        SETTINGS = data.settings;
        $('content').style.display = 'block';
        render();
        console.log('✅ Loaded settings from backend');
        return;
      }
    }
    
    // Fallback to mock data if backend not available
    console.warn('⚠️ Backend not available, using mock data for testing');
    SETTINGS = MOCK_SETTINGS;
    $('content').style.display = 'block';
    render();
    
    // Show a notice about mock mode
    const notice = document.createElement('div');
    notice.style.cssText = 'position:fixed;top:10px;right:10px;background:#f59e0b;color:white;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;z-index:1000;';
    notice.textContent = '⚠️ MOCK MODE - Backend not available';
    document.body.appendChild(notice);
    
  } catch(e) { 
    console.error('Load error:', e);
    // Use mock data as fallback
    console.warn('⚠️ Using mock data for testing');
    SETTINGS = MOCK_SETTINGS;
    $('content').style.display = 'block';
    render();
    
    // Show a notice about mock mode
    const notice = document.createElement('div');
    notice.style.cssText = 'position:fixed;top:10px;right:10px;background:#f59e0b;color:white;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;z-index:1000;';
    notice.textContent = '⚠️ MOCK MODE - Testing only';
    document.body.appendChild(notice);
  }
}

function render() {
  const banners = SETTINGS.banners || {};
  
  // Hero slideshow
  const heroSlideshow = banners.heroSlideshow || {};
  $('heroSlideshowEnabled').value = heroSlideshow.enabled !== false ? 'true' : 'false';
  $('heroAutoplaySpeed').value = heroSlideshow.autoplaySpeed || 4;
  $('heroHeight').value = heroSlideshow.height || 200;
  renderHeroSlides(heroSlideshow.slides || []);
  
  // Offer banners
  const offerBanners = banners.offerBanners || {};
  $('offerBannersEnabled').value = offerBanners.enabled !== false ? 'true' : 'false';
  renderOfferBanners(offerBanners.banners || []);
  
  // Categories
  renderCategories(SETTINGS.categories || []);
  
  updatePreview();
}

function renderHeroSlides(slides) {
  $('heroSlidesList').innerHTML = slides.map((slide, i) => `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Hero Slide ${i+1}</span>
        <div class="card-actions">
          <label class="toggle">
            <input type="checkbox" class="hs-enabled" ${slide.enabled!==false?'checked':''}>
            <span class="slider"></span>
          </label>
          <button class="btn-del" onclick="removeHeroSlide(${i})">🗑️</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Title Line 1</label><input class="hs-title1" value="${slide.title1||''}" placeholder="Farm Fresh Meat,"/></div>
        <div class="field"><label>Title Line 2</label><input class="hs-title2" value="${slide.title2||''}" placeholder="Delivered to You"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Badge Text</label><input class="hs-badge" value="${slide.badge||''}" placeholder="100% GUARANTEED"/></div>
        <div class="field"><label>Button Text</label><input class="hs-button-text" value="${slide.buttonText||''}" placeholder="Order Now →"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Subtitle Line 1</label><input class="hs-subtitle" value="${slide.subtitle||''}" placeholder="Halal • Hygienic • Trusted"/></div>
        <div class="field"><label>Subtitle Line 2</label><input class="hs-subtitle2" value="${slide.subtitle2||''}" placeholder="AI ensures best quality"/></div>
      </div>
      <div class="field">
        <label>Features (comma separated)</label>
        <input class="hs-features" value="${(slide.features||[]).join(', ')}" placeholder="⚡ 15 Min Delivery, ❄️ Sub-Zero Cold Chain, ✅ 100% Halal Certified">
      </div>
      <div class="field-row-3">
        <div class="field">
          <label>Background Color</label>
          <input type="color" class="hs-background-color" value="${slide.backgroundColor||'#FFFFFF'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field">
          <label>Text Color</label>
          <input type="color" class="hs-text-color" value="${slide.textColor||'#1A1A1A'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field">
          <label>Badge Color</label>
          <input type="color" class="hs-badge-color" value="${slide.badgeColor||'#E63946'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
      </div>
      <div class="field-row-3">
        <div class="field">
          <label>Button Color</label>
          <input type="color" class="hs-button-color" value="${slide.buttonColor||'#E63946'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field">
          <label>Subtitle Color</label>
          <input type="color" class="hs-subtitle-color" value="${slide.subtitleColor||'#6B7280'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field">
          <label>Quality Badge Color</label>
          <input type="color" class="hs-quality-badge-color" value="${slide.qualityBadgeColor||'#10B981'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Height (px)</label><input type="number" class="hs-height" value="${slide.height||200}" min="150" max="400"></div>
        <div class="field"><label>Title Size (px)</label><input type="number" class="hs-title-size" value="${slide.titleSize||22}" min="16" max="36"></div>
        <div class="field"><label>Subtitle Size (px)</label><input type="number" class="hs-subtitle-size" value="${slide.subtitleSize||14}" min="12" max="20"></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Button Size (px)</label><input type="number" class="hs-button-size" value="${slide.buttonSize||14}" min="12" max="18"></div>
        <div class="field"><label>Image Width (px)</label><input type="number" class="hs-image-width" value="${slide.imageWidth||140}" min="100" max="200"></div>
        <div class="field"><label>Image Height (px)</label><input type="number" class="hs-image-height" value="${slide.imageHeight||140}" min="100" max="200"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Image URL</label><input class="hs-image" value="${slide.image||''}" placeholder="/photos/meat-stack.jpg or https://..."/></div>
        <div class="field"><label>Quality Badge Text</label><input class="hs-quality-badge-text" value="${slide.qualityBadgeText||''}" placeholder="99.4% Excellent"/></div>
      </div>
    </div>
  `).join('');
}

function renderOfferBanners(banners) {
  $('offerBannersList').innerHTML = banners.map((banner, i) => `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Offer Banner ${i+1}</span>
        <div class="card-actions">
          <label class="toggle">
            <input type="checkbox" class="ob-enabled" ${banner.enabled!==false?'checked':''}>
            <span class="slider"></span>
          </label>
          <button class="btn-del" onclick="removeOfferBanner(${i})">🗑️</button>
        </div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Label</label><input class="ob-label" value="${banner.label||''}" placeholder="Special Offer"/></div>
        <div class="field"><label>Title</label><input class="ob-title" value="${banner.title||''}" placeholder="Limited Time"/></div>
        <div class="field"><label>Subtitle</label><input class="ob-subtitle" value="${banner.subtitle||''}" placeholder="Save Now"/></div>
      </div>
      <div class="field-row-3">
        <div class="field">
          <label>Background Color</label>
          <input type="color" class="ob-background-color" value="${banner.backgroundColor||'#10B981'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field">
          <label>Text Color</label>
          <input type="color" class="ob-text-color" value="${banner.textColor||'#FFFFFF'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
        <div class="field"><label>Icon (Fallback)</label><input class="ob-icon" value="${banner.icon||'🎯'}" maxlength="2"/></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Image URL</label><input class="ob-image" value="${banner.image||''}" placeholder="/photos/delivery.jpg or https://..."/></div>
        <div class="field"><label>Image Size (px)</label><input class="ob-image-size" type="number" value="${banner.imageSize||60}" min="40" max="100"/></div>
        <div class="field"><label>Icon Size (px)</label><input class="ob-icon-size" type="number" value="${banner.iconSize||28}" min="16" max="48"/></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Width (px)</label><input class="ob-width" type="number" value="${banner.width||280}" min="200" max="400"/></div>
        <div class="field"><label>Height (px)</label><input class="ob-height" type="number" value="${banner.height||100}" min="80" max="150"/></div>
        <div class="field"><label>Label Size (px)</label><input class="ob-label-size" type="number" value="${banner.labelSize||10}" min="8" max="16"/></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Title Size (px)</label><input class="ob-title-size" type="number" value="${banner.titleSize||16}" min="12" max="24"/></div>
        <div class="field"><label>Subtitle Size (px)</label><input class="ob-subtitle-size" type="number" value="${banner.subtitleSize||12}" min="10" max="18"/></div>
        <div class="field"></div>
      </div>
    </div>
  `).join('');
}

function renderCategories(categories) {
  $('categoriesList').innerHTML = categories.map((cat, i) => `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Category: ${cat.name || 'Untitled'}</span>
        <div class="card-actions">
          <label class="toggle">
            <input type="checkbox" class="cat-enabled" ${cat.enabled!==false?'checked':''}>
            <span class="slider"></span>
          </label>
          <button class="btn-del" onclick="removeCategory(${i})">🗑️</button>
        </div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Category ID</label><input class="cat-id" value="${cat.id||''}" placeholder="chicken"/></div>
        <div class="field"><label>Display Name</label><input class="cat-name" value="${cat.name||''}" placeholder="Chicken"/></div>
        <div class="field"><label>Sort Order</label><input class="cat-order" type="number" value="${cat.order||i}" min="0"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Icon/Emoji</label><input class="cat-icon" value="${cat.icon||''}" placeholder="🐔"/></div>
        <div class="field"><label>Image URL (Optional)</label><input class="cat-image" value="${cat.image||''}" placeholder="Leave empty to use emoji"/></div>
      </div>
      <div class="field-row-3">
        <div class="field"><label>Circle Size (px)</label><input class="cat-size" type="number" value="${cat.size||48}" min="32" max="80"/></div>
        <div class="field"><label>Label Size (px)</label><input class="cat-label-size" type="number" value="${cat.labelSize||12}" min="8" max="18"/></div>
        <div class="field">
          <label>Active Color</label>
          <input type="color" class="cat-active-color" value="${cat.activeColor||'#E63946'}" style="width:100%;height:40px;border:1px solid #e5e7eb;border-radius:8px;cursor:pointer;">
        </div>
      </div>
    </div>
  `).join('');
}

function addHeroSlide() {
  const slides = collectHeroSlides();
  slides.push({
    title1: 'Farm Fresh Meat,',
    title2: 'Delivered to You',
    badge: '100% GUARANTEED',
    buttonText: 'Order Now →',
    subtitle: 'Halal • Hygienic • Trusted',
    subtitle2: 'AI ensures best quality',
    features: ['⚡ 15 Min Delivery', '❄️ Sub-Zero Cold Chain', '✅ 100% Halal Certified', '🚫 No Added Hormones'],
    backgroundColor: '#FFFFFF',
    textColor: '#1A1A1A',
    badgeColor: '#E63946',
    buttonColor: '#E63946',
    subtitleColor: '#6B7280',
    qualityBadgeColor: '#10B981',
    height: 200,
    titleSize: 22,
    subtitleSize: 14,
    buttonSize: 14,
    imageWidth: 140,
    imageHeight: 140,
    image: '/photos/meat-stack.jpg',
    qualityBadgeText: '99.4% Excellent',
    enabled: true
  });
  renderHeroSlides(slides);
  updatePreview();
}

function addOfferBanner() {

    label: 'Special Offer',

    subtitle: 'Save Now',
    backgroundColor: '#10B981',

    height: 100,
    iconSize: 28,
    labelSize: 10,
    titleSize: 16,
    subtitleSize: 12,
    enabled: true
  });
  renderOfferBanners(banners);
  updatePreview();
}

function addCategory() {
  const categories = collectCategories();
  categories.push({
    id: 'new_category',

function removeHeroSlide(i) {
  const slides = collectHeroSlides();
  slides.splice(i, 1);
  renderHeroSlides(slides);
  updatePreview();
}

function removeOfferBanner(i) {
  const banners = collectOfferBanners();
  banners.splice(i, 1);
  renderOfferBanners(banners);
  updatePreview();
}

function removeCategory(i) {
  const categories = collectCategories();
  categories.splice(i, 1);
  renderCategories(categories);
  updatePreview();
}

function collectHeroSlides() {
  const cards = $('heroSlidesList').querySelectorAll('.card');
  return Array.from(cards).map(c => ({
    title1: c.querySelector('.hs-title1').value.trim(),
    title2: c.querySelector('.hs-title2').value.trim(),
    badge: c.querySelector('.hs-badge').value.trim(),
    buttonText: c.querySelector('.hs-button-text').value.trim(),
    subtitle: c.querySelector('.hs-subtitle').value.trim(),
    subtitle2: c.querySelector('.hs-subtitle2').value.trim(),
    features: c.querySelector('.hs-features').value.split(',').map(f => f.trim()).filter(f => f),
    backgroundColor: c.querySelector('.hs-background-color').value.trim(),
    textColor: c.querySelector('.hs-text-color').value.trim(),
    badgeColor: c.querySelector('.hs-badge-color').value.trim(),
    buttonColor: c.querySelector('.hs-button-color').value.trim(),
    subtitleColor: c.querySelector('.hs-subtitle-color').value.trim(),
    qualityBadgeColor: c.querySelector('.hs-quality-badge-color').value.trim(),
    height: parseInt(c.querySelector('.hs-height').value) || 200,
    titleSize: parseInt(c.querySelector('.hs-title-size').value) || 22,
    subtitleSize: parseInt(c.querySelector('.hs-subtitle-size').value) || 14,
    buttonSize: parseInt(c.querySelector('.hs-button-size').value) || 14,
    imageWidth: parseInt(c.querySelector('.hs-image-width').value) || 140,
    imageHeight: parseInt(c.querySelector('.hs-image-height').value) || 140,
    image: c.querySelector('.hs-image').value.trim(),
    qualityBadgeText: c.querySelector('.hs-quality-badge-text').value.trim(),
    enabled: c.querySelector('.hs-enabled').checked
  }));
}

function collectOfferBanners() {
  const cards = $('offerBannersList').querySelectorAll('.card');
  return Array.from(cards).map(c => ({
    label: c.querySelector('.ob-label').value.trim(),
    title: c.querySelector('.ob-title').value.trim(),
    subtitle: c.querySelector('.ob-subtitle').value.trim(),
    backgroundColor: c.querySelector('.ob-background-color').value.trim(),
    textColor: c.querySelector('.ob-text-color').value.trim(),
    icon: c.querySelector('.ob-icon').value.trim(),
    image: c.querySelector('.ob-image').value.trim(),
    imageSize: parseInt(c.querySelector('.ob-image-size').value) || 60,
    width: parseInt(c.querySelector('.ob-width').value) || 280,
    height: parseInt(c.querySelector('.ob-height').value) || 100,
    iconSize: parseInt(c.querySelector('.ob-icon-size').value) || 28,
    labelSize: parseInt(c.querySelector('.ob-label-size').value) || 10,
    titleSize: parseInt(c.querySelector('.ob-title-size').value) || 16,
    subtitleSize: parseInt(c.querySelector('.ob-subtitle-size').value) || 12,
    enabled: c.querySelector('.ob-enabled').checked
  }));
}

function collectCategories() {
  const cards = $('categoriesList').querySelectorAll('.card');
  return Array.from(cards).map(c => ({
    id: c.querySelector('.cat-id').value.trim(),
    name: c.querySelector('.cat-name').value.trim(),
    icon: c.querySelector('.cat-icon').value.trim(),
    image: c.querySelector('.cat-image').value.trim(),
    size: parseInt(c.querySelector('.cat-size').value) || 48,
    labelSize: parseInt(c.querySelector('.cat-label-size').value) || 12,
    activeColor: c.querySelector('.cat-active-color').value.trim(),
    order: parseInt(c.querySelector('.cat-order').value) || 0,
    enabled: c.querySelector('.cat-enabled').checked
  })).sort((a, b) => a.order - b.order);
}

function updatePreview() {
  // Hero Preview
  const slides = collectHeroSlides();
  $('heroPreview').innerHTML = slides.filter(s => s.enabled).slice(0, 1).map(slide => `
    <div class="preview-hero" style="background: ${slide.backgroundColor}; color: ${slide.textColor}; height: ${slide.height}px;">
      <div>
        <div style="font-size: ${slide.titleSize}px; font-weight: 800; margin-bottom: 2px;">${slide.title1}</div>
        <div style="font-size: ${slide.titleSize}px; font-weight: 800; margin-bottom: 4px;">${slide.title2}</div>
        <div style="font-size: ${slide.offerSize}px; opacity: 0.9;">${slide.offerLabel} <strong>${slide.offerValue}</strong></div>
      </div>
      <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center;">📷</div>
    </div>
  `).join('') || '<div style="color: #6b7280; text-align: center; padding: 20px;">No enabled slides</div>';
  
  // Offer Preview
  const offers = collectOfferBanners();
  $('offerPreview').innerHTML = offers.filter(o => o.enabled).map(offer => `
    <div class="preview-banner" style="background: ${offer.backgroundColor}; color: ${offer.textColor}; width: ${offer.width}px; height: ${offer.height}px; display: inline-block; margin-right: 8px;">
      <div>
        <div style="font-size: ${offer.labelSize}px; opacity: 0.9;">${offer.label}</div>
        <div style="font-size: ${offer.titleSize}px; font-weight: 800;">${offer.title}</div>
        <div style="font-size: ${offer.subtitleSize}px; opacity: 0.8;">${offer.subtitle}</div>
      </div>
      <div style="font-size: ${offer.iconSize}px;">${offer.icon}</div>
    </div>
  `).join('') || '<div style="color: #6b7280; text-align: center; padding: 20px;">No enabled banners</div>';
  
  // Category Preview
  const categories = collectCategories();
  $('categoryPreview').innerHTML = categories.filter(c => c.enabled).map(cat => `
    <div class="category-preview">
      <div class="cat-icon-preview" style="width: ${cat.size}px; height: ${cat.size}px; border-color: ${cat.activeColor};">
        ${cat.image ? `<img src="${cat.image}" style="width: ${cat.size-8}px; height: ${cat.size-8}px; border-radius: 50%; object-fit: cover;">` : `<span style="font-size: ${cat.size*0.5}px;">${cat.icon}</span>`}
      </div>
      <div class="cat-name-preview" style="font-size: ${cat.labelSize}px; color: ${cat.activeColor};">${cat.name}</div>
    </div>
  `).join('') || '<div style="color: #6b7280; text-align: center; padding: 20px;">No enabled categories</div>';
}

// Add event listeners for real-time preview updates
document.addEventListener('change', updatePreview);
document.addEventListener('input', updatePreview);

async function saveAll() {
  const banners = {
    heroSlideshow: {
      enabled: $('heroSlideshowEnabled').value === 'true',
      autoplaySpeed: parseInt($('heroAutoplaySpeed').value) || 4,
      height: parseInt($('heroHeight').value) || 200,
      slides: collectHeroSlides()
    },
    offerBanners: {
      enabled: $('offerBannersEnabled').value === 'true',
      banners: collectOfferBanners()
    }
  };
  
  const categories = collectCategories();
  
  try {
    const res = await fetch('/admin/settings', {
      method: 'PUT', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ banners, categories })
    });
    
    if (res.ok) {
      const data = await res.json();
      if (data.ok) {
        alert('✅ Saved successfully!');
        return;
      }
    }
    
    // If backend save fails, simulate save in mock mode
    console.warn('⚠️ Backend save failed, simulating save in mock mode');
    SETTINGS.banners = banners;
    SETTINGS.categories = categories;
    
    // Show success message for mock mode
    alert('✅ Changes saved (Mock Mode)!\n\nNote: Changes are only saved locally for testing. In production mode, changes would be saved to the server.');
    
    // Trigger a refresh of the main site to show changes
    console.log('📤 Mock save completed - changes applied locally');
    
  } catch(e) {
    console.warn('⚠️ Network error, using mock save');
    // Simulate save in mock mode
    SETTINGS.banners = banners;
    SETTINGS.categories = categories;
    alert('✅ Changes saved (Mock Mode)!\n\nNote: This is a test mode. In production, changes would be saved to the server.');
  }
}

</script>
