<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeatPe Admin — Reviews</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d62828;
      --green: #16a34a;
      --orange: #f77f00;
      --gray: #6b7280;
      --light: #f3f4f6;
      --border: #e5e7eb;
      --dark: #1a1a1a;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--light); color: var(--dark); padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    h1 img { height: 36px; }
    .sub { color: var(--gray); margin-bottom: 20px; }
    .nav-links { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-links a {
      padding: 8px 14px; background: white; border-radius: 8px;
      color: var(--gray); text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); transition: all .15s;
    }
    .nav-links a:hover { border-color: var(--primary); color: var(--primary); }
    .nav-links a.active { background: var(--primary); color: white; border-color: var(--primary); }
    .key-bar {
      background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 18px;
      display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      flex-wrap: wrap;
    }
    .key-bar label { font-weight: 600; font-size: 14px; }
    .key-bar input {
      flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: monospace;
    }
    .key-bar button {
      background: var(--primary); color: white; border: none; padding: 9px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: white; padding: 16px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .stat .label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .stat .val { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .stat.primary .val { color: var(--primary); }
    .stat.green .val { color: var(--green); }
    .stat.orange .val { color: var(--orange); }

    .review-card {
      background: white; border-radius: 12px; margin-bottom: 14px;
      padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-left: 4px solid var(--orange);
    }
    .review-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .review-user {
      display: flex; flex-direction: column;
    }
    .review-name { font-size: 16px; font-weight: 700; }
    .review-phone { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .review-time { font-size: 12px; color: var(--gray); }
    .stars {
      display: flex; gap: 2px; font-size: 18px; margin-bottom: 8px;
    }
    .review-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .review-body { grid-template-columns: 1fr; }
    }
    .review-left {}
    .review-item {
      font-size: 14px; padding: 10px 12px; background: var(--light);
      border-radius: 8px; margin-bottom: 8px;
    }
    .review-item strong { color: var(--primary); }
    .review-comment {
      font-size: 14px; line-height: 1.6; color: var(--dark);
      background: var(--light); padding: 12px; border-radius: 8px;
    }
    .review-order {
      font-size: 12px; color: var(--gray); margin-top: 8px;
    }
    .empty {
      text-align: center; padding: 60px 20px; color: var(--gray);
      background: white; border-radius: 12px;
    }
    .empty .big { font-size: 56px; margin-bottom: 10px; }
    .err { background: #fee; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="/logo.png" alt="MeatPe" />Reviews Dashboard</h1>
  <p class="sub">Customer reviews and ratings for all products.</p>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <a href="/dashboard.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📊 Dashboard</a>
    <a href="/admin.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📦 Stock</a>
    <a href="/orders.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📋 Orders</a>
    <a href="/items.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🍗 Items</a>
    <a href="/coupons.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🏷️ Coupons</a>
    <a href="/reviews.html" style="padding:8px 14px;background:#d62828;color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;border-color:#d62828">⭐ Reviews</a>
    <a href="/returns.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">↩️ Returns</a>
    <a href="/users.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">👥 Users</a>
    <a href="/tickets.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🎫 Tickets</a>
    <a href="/delivery.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🚚 Delivery</a>
    <a href="/delivery-boys.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🛵 Riders</a>
    <a href="/banners.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🎨 Banners</a>
    <a href="/notifications-admin.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🔔 Notify</a>
    <a href="/reports.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📊 Reports</a>
    <a href="/settings.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">⚙️ Settings</a>
    <a href="/" target="_blank" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🌐 View Site</a>
  </div>

  <div class="key-bar">
    <label>Admin key:</label>
    <input id="key" type="password" placeholder="Enter ADMIN_KEY" autocomplete="off" />
    <button id="loadBtn">Load reviews</button>
  </div>

  <div id="msg"></div>
  <div id="stats" class="stats" style="display:none"></div>
  <div id="content"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const keyInput = $('key');
const content = $('content');
const msg = $('msg');
const statsEl = $('stats');

let ALL_REVIEWS = [];

const saved = localStorage.getItem('meatpe_admin_key');
if (saved) keyInput.value = saved;

$('loadBtn').addEventListener('click', loadReviews);
keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadReviews(); });
if (saved) loadReviews();

async function loadReviews() {
  msg.innerHTML = '';
  const key = keyInput.value.trim();
  if (!key) {
    msg.innerHTML = '<div class="err">Enter your admin key first.</div>';
    return;
  }
  localStorage.setItem('meatpe_admin_key', key);
  try {
    const res = await fetch(`/admin/reviews?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    ALL_REVIEWS = data.reviews;
    render();
  } catch (e) {
    msg.innerHTML = `<div class="err">Failed: ${escapeHtml(e.message || 'unknown')}. Check the admin key.</div>`;
  }
}

function render() {
  // Stats
  const totalReviews = ALL_REVIEWS.length;
  const avgRating = totalReviews > 0 
    ? (ALL_REVIEWS.reduce((sum, r) => sum + r.rating, 0) / totalReviews).toFixed(1)
    : '0.0';
  const star5 = ALL_REVIEWS.filter(r => r.rating === 5).length;
  const star4 = ALL_REVIEWS.filter(r => r.rating === 4).length;
  const star3 = ALL_REVIEWS.filter(r => r.rating === 3).length;
  const star2 = ALL_REVIEWS.filter(r => r.rating === 2).length;
  const star1 = ALL_REVIEWS.filter(r => r.rating === 1).length;

  statsEl.style.display = 'grid';
  statsEl.innerHTML = `
    <div class="stat primary"><div class="label">Total Reviews</div><div class="val">${totalReviews}</div></div>
    <div class="stat green"><div class="label">Avg Rating</div><div class="val">${avgRating} ⭐</div></div>
    <div class="stat orange"><div class="label">5 Star</div><div class="val">${star5}</div></div>
    <div class="stat orange"><div class="label">4 Star</div><div class="val">${star4}</div></div>
    <div class="stat orange"><div class="label">3 Star</div><div class="val">${star3}</div></div>
  `;

  // Reviews
  if (!ALL_REVIEWS.length) {
    content.innerHTML = `<div class="empty"><div class="big">⭐</div><p>No reviews yet.</p></div>`;
    return;
  }

  content.innerHTML = ALL_REVIEWS.map(renderReview).join('');
}

function renderReview(r) {
  const phoneClean = (r.phone || '').replace(/\D/g, '');
  const ts = formatTime(r.created_at);
  const stars = '⭐'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
  
  return `
    <div class="review-card">
      <div class="review-head">
        <div class="review-user">
          <div class="review-name">${escapeHtml(r.customer_name || 'Customer')}</div>
          <div class="review-phone">📱 +${phoneClean}</div>
        </div>
        <div class="review-time">${ts}</div>
      </div>
      <div class="review-body">
        <div class="review-left">
          <div class="stars">${stars}</div>
          <div class="review-item">
            <strong>Product:</strong> ${escapeHtml(r.item_name || r.item_code || 'Unknown')}
          </div>
          <div class="review-order">Order #${r.order_id}</div>
        </div>
        <div class="review-comment">
          ${escapeHtml(r.comment || 'No comment provided.')}
        </div>
      </div>
    </div>`;
}

function formatTime(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
