<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeatPe Admin — Users</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d62828;
      --green: #16a34a;
      --blue: #2563eb;
      --gray: #6b7280;
      --light: #f3f4f6;
      --border: #e5e7eb;
      --dark: #1a1a1a;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--light); color: var(--dark); padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    h1 img { height: 36px; }
    .sub { color: var(--gray); margin-bottom: 20px; }
    .nav-links { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-links a {
      padding: 8px 14px; background: white; border-radius: 8px;
      color: var(--gray); text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); transition: all .15s;
    }
    .nav-links a:hover { border-color: var(--primary); color: var(--primary); }
    .nav-links a.active { background: var(--primary); color: white; border-color: var(--primary); }
    .key-bar {
      background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 18px;
      display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      flex-wrap: wrap;
    }
    .key-bar label { font-weight: 600; font-size: 14px; }
    .key-bar input {
      flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: monospace;
    }
    .key-bar button {
      background: var(--primary); color: white; border: none; padding: 9px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: white; padding: 16px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .stat .label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .stat .val { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .stat.primary .val { color: var(--primary); }
    .stat.green .val { color: var(--green); }
    .stat.blue .val { color: var(--blue); }

    .user-card {
      background: white; border-radius: 12px; margin-bottom: 14px;
      padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-left: 4px solid var(--blue);
    }
    .user-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .user-name { font-size: 18px; font-weight: 700; }
    .user-phone { font-size: 14px; color: var(--gray); margin-top: 2px; }
    .user-stats {
      display: flex; gap: 20px; margin-top: 10px; font-size: 13px;
    }
    .user-stats div { display: flex; flex-direction: column; }
    .user-stats .label { color: var(--gray); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
    .user-stats .value { font-weight: 700; font-size: 16px; color: var(--primary); }
    .user-actions {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .user-actions a, .user-actions button {
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      font-weight: 600; text-decoration: none; display: inline-flex; gap: 4px;
      border: none; cursor: pointer;
    }
    .user-actions a.call { background: var(--blue); color: white; }
    .user-actions a.wa { background: #25d366; color: white; }
    .user-actions button.view { background: var(--primary); color: white; }
    .empty {
      text-align: center; padding: 60px 20px; color: var(--gray);
      background: white; border-radius: 12px;
    }
    .empty .big { font-size: 56px; margin-bottom: 10px; }
    .err { background: #fee; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
    
    /* User Detail Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,.6); z-index: 1000; overflow-y: auto;
      padding: 20px;
    }
    .modal.show { display: flex; align-items: flex-start; justify-content: center; }
    .modal-content {
      background: white; border-radius: 16px; width: 100%; max-width: 900px;
      margin: 40px auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
      animation: slideIn .3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { font-size: 20px; font-weight: 700; }
    .modal-close {
      background: none; border: none; font-size: 28px; cursor: pointer;
      color: var(--gray); line-height: 1; padding: 0; width: 32px; height: 32px;
    }
    .modal-body { padding: 24px; }
    
    .user-profile-header {
      background: linear-gradient(135deg, var(--primary), #a82020);
      padding: 24px; border-radius: 12px; color: white; margin-bottom: 24px;
    }
    .user-profile-name { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .user-profile-phone { font-size: 14px; opacity: .9; }
    .user-profile-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px; margin-top: 16px;
    }
    .user-profile-stats .stat-box {
      background: rgba(255,255,255,.15); padding: 12px; border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .user-profile-stats .stat-box .label {
      font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: .5px;
    }
    .user-profile-stats .stat-box .value {
      font-size: 22px; font-weight: 800; margin-top: 4px;
    }
    
    .detail-section {
      background: white; border: 1px solid var(--border); border-radius: 12px;
      padding: 18px 20px; margin-bottom: 16px;
    }
    .detail-section h3 {
      font-size: 16px; font-weight: 700; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .order-item {
      padding: 12px; background: var(--light); border-radius: 8px;
      margin-bottom: 10px; font-size: 13px;
    }
    .order-item:last-child { margin-bottom: 0; }
    .order-item-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .order-item-id { font-weight: 700; }
    .order-item-date { color: var(--gray); font-size: 11px; }
    .order-item-total { font-weight: 700; color: var(--primary); }
    .order-item-items { font-size: 12px; color: var(--gray); margin-top: 4px; }
    
    .top-items-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .top-item-card {
      background: var(--light); padding: 12px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .top-item-emoji { font-size: 32px; }
    .top-item-info { flex: 1; }
    .top-item-name { font-size: 13px; font-weight: 700; }
    .top-item-count {
      font-size: 11px; color: var(--gray);
      display: flex; align-items: center; gap: 4px; margin-top: 2px;
    }
    .top-item-count strong { color: var(--primary); }
    
    .review-item {
      padding: 12px; background: var(--light); border-radius: 8px;
      margin-bottom: 10px; font-size: 13px;
    }
    .review-item:last-child { margin-bottom: 0; }
    .review-stars { color: #f59e0b; margin-bottom: 4px; }
    .review-product { font-weight: 700; margin-bottom: 4px; }
    .review-comment { font-size: 12px; color: var(--gray); }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="/logo.png" alt="MeatPe" />Users Dashboard</h1>
  <p class="sub">All registered users who have placed orders.</p>

  <div class="nav-links">
    <a href="/dashboard.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📊 Dashboard</a>`n    <a href="/admin.html">📦 Stock</a>
    <a href="/orders.html">📋 Orders</a>
    <a href="/items.html">🍗 Items</a>
    <a href="/coupons.html">🏷️ Coupons</a>
    <a href="/reviews.html">⭐ Reviews</a>
    <a href="/returns.html">↩️ Returns</a>
    <a href="/users.html" class="active">👥 Users</a>`n    <a href="/tickets.html">🎫 Tickets</a>
    <a href="/settings.html">⚙️ Settings</a>
    <a href="/" target="_blank">🌐 View Site</a>
  </div>

  <div class="key-bar">
    <label>Admin key:</label>
    <input id="key" type="password" placeholder="Enter ADMIN_KEY" autocomplete="off" />
    <button id="loadBtn">Load users</button>
  </div>

  <div id="msg"></div>
  <div id="stats" class="stats" style="display:none"></div>
  <div id="content"></div>
  
  <!-- User Detail Modal -->
  <div id="userModal" class="modal" onclick="if(event.target===this) closeUserModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h2>User Profile</h2>
        <button class="modal-close" onclick="closeUserModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        Loading...
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const keyInput = $('key');
const content = $('content');
const msg = $('msg');
const statsEl = $('stats');

let ALL_USERS = [];

const saved = localStorage.getItem('meatpe_admin_key');
if (saved) keyInput.value = saved;

$('loadBtn').addEventListener('click', loadUsers);
keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUsers(); });
if (saved) loadUsers();

async function loadUsers() {
  msg.innerHTML = '';
  const key = keyInput.value.trim();
  if (!key) {
    msg.innerHTML = '<div class="err">Enter your admin key first.</div>';
    return;
  }
  localStorage.setItem('meatpe_admin_key', key);
  try {
    const res = await fetch(`/admin/users?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    ALL_USERS = data.users;
    render();
  } catch (e) {
    msg.innerHTML = `<div class="err">Failed: ${escapeHtml(e.message || 'unknown')}. Check the admin key.</div>`;
  }
}

function render() {
  // Stats
  const totalUsers = ALL_USERS.length;
  const totalOrders = ALL_USERS.reduce((sum, u) => sum + (u.total_orders || 0), 0);
  const totalSpent = ALL_USERS.reduce((sum, u) => sum + (u.total_spent || 0), 0);
  
  statsEl.style.display = 'grid';
  statsEl.innerHTML = `
    <div class="stat primary"><div class="label">Total Users</div><div class="val">${totalUsers}</div></div>
    <div class="stat green"><div class="label">Total Orders</div><div class="val">${totalOrders}</div></div>
    <div class="stat blue"><div class="label">Total Revenue</div><div class="val">₹${totalSpent}</div></div>
  `;

  // Users
  if (!ALL_USERS.length) {
    content.innerHTML = `<div class="empty"><div class="big">👥</div><p>No users yet.</p></div>`;
    return;
  }

  content.innerHTML = ALL_USERS.map(renderUser).join('');
}

function renderUser(u) {
  // Phone is already clean (just digits), add +91 for display
  const phoneDisplay = u.phone.startsWith('+') ? u.phone : `+91${u.phone.replace(/\D/g, '')}`;
  const phoneClean = u.phone.replace(/\D/g, '');
  const lastOrder = u.last_order_date ? formatTime(u.last_order_date) : 'Never';
  
  return `
    <div class="user-card">
      <div class="user-head">
        <div>
          <div class="user-name">${escapeHtml(u.name || 'Customer')}</div>
          <div class="user-phone">📱 ${phoneDisplay}</div>
        </div>
        <div class="user-actions">
          <button class="view" onclick="viewUserDetail('${phoneClean}')">👁️ View Profile</button>
          <a href="tel:+${phoneClean}" class="call">📞 Call</a>
        </div>
      </div>
      <div class="user-stats">
        <div><span class="label">Total Orders</span><span class="value">${u.total_orders || 0}</span></div>
        <div><span class="label">Total Spent</span><span class="value">₹${u.total_spent || 0}</span></div>
        <div><span class="label">Last Order</span><span class="value" style="font-size:13px;color:var(--gray)">${lastOrder}</span></div>
      </div>
    </div>`;
}

async function viewUserDetail(phone) {
  const modal = document.getElementById('userModal');
  const modalBody = document.getElementById('modalBody');
  modal.classList.add('show');
  modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray)">Loading user details...</div>';
  
  const key = keyInput.value.trim();
  try {
    const res = await fetch(`/admin/users/${encodeURIComponent(phone)}/detail?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    
    renderUserDetail(data.user);
  } catch (e) {
    modalBody.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
  }
}

function renderUserDetail(user) {
  // Phone is already clean (just digits), add +91 for display
  const phoneDisplay = user.phone.startsWith('+') ? user.phone : `+91${user.phone.replace(/\D/g, '')}`;
  const phoneClean = user.phone.replace(/\D/g, '');
  const modalBody = document.getElementById('modalBody');
  
  // Top items
  const topItemsHtml = user.top_items && user.top_items.length > 0
    ? user.top_items.map(item => `
        <div class="top-item-card">
          <div class="top-item-emoji">🍗</div>
          <div class="top-item-info">
            <div class="top-item-name">${escapeHtml(item.item_name)}</div>
            <div class="top-item-count">Ordered <strong>${item.count}x</strong></div>
          </div>
        </div>
      `).join('')
    : '<p style="color:var(--gray);font-size:13px">No favorite items yet.</p>';
  
  // Recent orders
  const ordersHtml = user.orders && user.orders.length > 0
    ? user.orders.map(order => {
        const items = JSON.parse(order.items_json || '[]');
        const itemsText = items.map(i => `${i.name} x${i.qty}`).join(', ');
        return `
          <div class="order-item">
            <div class="order-item-header">
              <span class="order-item-id">Order #${order.id}</span>
              <span class="order-item-date">${formatTime(order.created_at)}</span>
            </div>
            <div class="order-item-items">${itemsText}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
              <span class="order-item-total">₹${order.total}</span>
              <span style="font-size:11px;color:var(--gray)">${order.status}</span>
            </div>
          </div>
        `;
      }).join('')
    : '<p style="color:var(--gray);font-size:13px">No orders yet.</p>';
  
  // Reviews
  const reviewsHtml = user.reviews && user.reviews.length > 0
    ? user.reviews.map(review => `
        <div class="review-item">
          <div class="review-stars">${'⭐'.repeat(review.rating)}</div>
          <div class="review-product">${escapeHtml(review.item_name || review.item_code)}</div>
          ${review.comment ? `<div class="review-comment">"${escapeHtml(review.comment)}"</div>` : ''}
        </div>
      `).join('')
    : '<p style="color:var(--gray);font-size:13px">No reviews yet.</p>';
  
  const avgRating = user.avg_rating ? Number(user.avg_rating).toFixed(1) : '0.0';
  
  // Address breakdown
  const addressHtml = user.address_breakdown && user.address_breakdown.length > 0
    ? user.address_breakdown.map(addr => {
        const topItemsText = addr.top_items && addr.top_items.length > 0
          ? addr.top_items.map(item => `${item.item_name} (${item.count}x)`).join(', ')
          : 'No items';
        
        const ordersPreview = addr.orders.slice(0, 3).map(o => {
          const items = JSON.parse(o.items_json || '[]');
          return `#${o.id} - ${items.map(i => i.name).join(', ')} (₹${o.total})`;
        }).join('<br/>');
        
        return `
          <div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:12px">
            <div style="font-weight:700;margin-bottom:6px">📍 ${escapeHtml(addr.address)}</div>
            <div style="font-size:12px;color:var(--gray);margin-bottom:8px">
              <strong>${addr.order_count}</strong> orders placed • Top items: ${topItemsText}
            </div>
            <details style="font-size:12px">
              <summary style="cursor:pointer;color:var(--primary);font-weight:600">View orders to this address</summary>
              <div style="margin-top:8px;padding:8px;background:white;border-radius:6px">
                ${ordersPreview}
                ${addr.orders.length > 3 ? `<div style="margin-top:4px;color:var(--gray)">...and ${addr.orders.length - 3} more</div>` : ''}
              </div>
            </details>
          </div>
        `;
      }).join('')
    : '<p style="color:var(--gray);font-size:13px">No addresses yet.</p>';
  
  modalBody.innerHTML = `
    <div class="user-profile-header">
      <div class="user-profile-name">${escapeHtml(user.name || 'Customer')}</div>
      <div class="user-profile-phone">📱 ${phoneDisplay}</div>
      <div class="user-profile-stats">
        <div class="stat-box"><div class="label">Total Orders</div><div class="value">${user.total_orders || 0}</div></div>
        <div class="stat-box"><div class="label">Total Spent</div><div class="value">₹${user.total_spent || 0}</div></div>
        <div class="stat-box"><div class="label">Delivery Addresses</div><div class="value">${user.addresses ? user.addresses.length : 0}</div></div>
        <div class="stat-box"><div class="label">Avg Rating Given</div><div class="value">${avgRating} ⭐</div></div>
      </div>
    </div>
    
    <div class="detail-section">
      <h3>📍 Delivery Addresses (${user.addresses ? user.addresses.length : 0})</h3>
      ${addressHtml}
    </div>
    
    <div class="detail-section">
      <h3>🔥 Favorite Items (Overall)</h3>
      <div class="top-items-grid">
        ${topItemsHtml}
      </div>
    </div>
    
    <div class="detail-section">
      <h3>📦 Recent Orders (Last 10)</h3>
      ${ordersHtml}
    </div>
    
    <div class="detail-section">
      <h3>⭐ Reviews Given (${user.reviews ? user.reviews.length : 0})</h3>
      ${reviewsHtml}
    </div>
  `;
}

function closeUserModal() {
  document.getElementById('userModal').classList.remove('show');
}

function formatTime(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
