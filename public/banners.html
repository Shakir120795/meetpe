<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Banner Management</title>
<link rel="icon" type="image/png" href="/logo.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f3f4f6;color:#1a1a1a;padding:20px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:24px;margin-bottom:6px}
.sub{color:#6b7280;margin-bottom:18px;font-size:14px}
.nav-links{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.nav-links a{padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb}
.nav-links a:hover{color:#d62828;border-color:#d62828}
.nav-links a.active{background:#d62828;color:white;border-color:#d62828}
.section{background:white;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.section h2{font-size:18px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#6b7280}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:10px}
.btn-save{padding:12px 24px;background:#16a34a;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
.btn-add{padding:8px 16px;background:#d62828;color:white;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-del{padding:4px 10px;background:#fee2e2;color:#ef4444;border:none;border-radius:6px;font-size:12px;cursor:pointer}
#content{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🎨 Banner Management</h1>
<p class="sub">Manage home page banners. Changes reflect instantly on app.</p>
<div class="nav-links">
<a href="/dashboard.html">📊 Dashboard</a>
<a href="/orders.html">📋 Orders</a>
<a href="/items.html">🍗 Items</a>
<a href="/banners.html" class="active">🎨 Banners</a>
<a href="/settings.html">⚙️ Settings</a>
</div>
<div style="background:white;padding:14px 16px;border-radius:12px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.04)">
<input id="key" type="password" placeholder="Admin key" style="flex:1;min-width:200px;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px"/>
<button onclick="loadData()" style="padding:9px 18px;background:#d62828;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer">Load</button>
</div>
<div id="content">

<!-- Hero Banner -->
<div class="section">
<h2>🖼️ Hero Banner (Main)</h2>
<div class="field"><label>Enabled</label><select id="heroEnabled"><option value="true">Yes</option><option value="false">No - Hide</option></select></div>
<div class="field-row">
<div class="field"><label>Badge Text</label><input id="heroBadge" placeholder="⚡ NOW OPEN"/></div>
<div class="field"><label>Emoji (right side)</label><input id="heroEmoji" placeholder="🥩"/></div>
</div>
<div class="field"><label>Title</label><input id="heroTitle" placeholder="Premium Fresh Meat"/></div>
<div class="field"><label>Subtitle</label><input id="heroSubtitle" placeholder="Delivered in 25-35 min"/></div>
<div class="field"><label>Pill Text</label><input id="heroPill" placeholder="Free cleaning + cutting"/></div>
<div class="field"><label>Background Gradient</label><input id="heroGradient" placeholder="linear-gradient(120deg,#1a0500,#2d0a00)"/></div>
</div>

<!-- Offer Banners -->
<div class="section">
<h2>🏷️ Offer Banners (Scrollable Cards)</h2>
<div id="offerBannersList"></div>
<button class="btn-add" onclick="addOfferBanner()">➕ Add Banner</button>
</div>

<button class="btn-save" onclick="saveAll()">💾 Save Banners</button>
</div>
</div>
<script>
const $ = id => document.getElementById(id);
let SETTINGS = null;
const saved = localStorage.getItem('meatpe_admin_key');
if (saved) { $('key').value = saved; loadData(); }
function getKey() { const k = $('key').value.trim(); localStorage.setItem('meatpe_admin_key', k); return k; }

async function loadData() {
  try {
    const res = await fetch('/admin/settings?key=' + encodeURIComponent(getKey()));
    const data = await res.json();
    if (!data.ok) { alert(data.error); return; }
    SETTINGS = data.settings;
    $('content').style.display = 'block';
    render();
  } catch(e) { alert('Network error'); }
}

function render() {
  const b = SETTINGS.banners || {};
  const hero = b.heroBanner || {};
  $('heroEnabled').value = hero.enabled === false ? 'false' : 'true';
  $('heroBadge').value = hero.badge || '';
  $('heroEmoji').value = hero.emoji || '🥩';
  $('heroTitle').value = hero.title || '';
  $('heroSubtitle').value = hero.subtitle || '';
  $('heroPill').value = hero.pill || '';
  $('heroGradient').value = hero.bgGradient || '';
  renderOfferBanners(b.offerBanners || []);
}

function renderOfferBanners(banners) {
  $('offerBannersList').innerHTML = banners.map((b, i) => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>Banner ${i+1}</strong>
        <div><label style="font-size:12px;margin-right:8px"><input type="checkbox" class="ob-enabled" ${b.enabled!==false?'checked':''}/> Enabled</label><button class="btn-del" onclick="removeOfferBanner(${i})">🗑️</button></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Label</label><input class="ob-label" value="${b.label||''}"/></div>
        <div class="field"><label>Title</label><input class="ob-title" value="${b.title||''}"/></div>
      </div>
      <div class="field"><label>Subtitle</label><input class="ob-subtitle" value="${b.subtitle||''}"/></div>
      <div class="field-row">
        <div class="field"><label>Gradient</label><input class="ob-gradient" value="${b.gradient||''}"/></div>
        <div class="field"><label>Label Color</label><input class="ob-color" value="${b.labelColor||''}"/></div>
      </div>
    </div>
  `).join('');
}

function addOfferBanner() {
  const banners = collectOfferBanners();
  banners.push({ id: 'b'+Date.now(), label: 'NEW', title: 'Banner Title', subtitle: 'Description', gradient: 'linear-gradient(135deg,#1a1a1a,#333)', labelColor: '#fff', enabled: true });
  renderOfferBanners(banners);
}

function removeOfferBanner(i) {
  const banners = collectOfferBanners();
  banners.splice(i, 1);
  renderOfferBanners(banners);
}

function collectOfferBanners() {
  const cards = $('offerBannersList').querySelectorAll('.card');
  return Array.from(cards).map(c => ({
    id: 'b' + Math.random().toString(36).slice(2,6),
    label: c.querySelector('.ob-label').value.trim(),
    title: c.querySelector('.ob-title').value.trim(),
    subtitle: c.querySelector('.ob-subtitle').value.trim(),
    gradient: c.querySelector('.ob-gradient').value.trim(),
    labelColor: c.querySelector('.ob-color').value.trim(),
    enabled: c.querySelector('.ob-enabled').checked
  }));
}

async function saveAll() {
  const banners = {
    heroBanner: {
      enabled: $('heroEnabled').value !== 'false',
      badge: $('heroBadge').value.trim(),
      emoji: $('heroEmoji').value.trim(),
      title: $('heroTitle').value.trim(),
      subtitle: $('heroSubtitle').value.trim(),
      pill: $('heroPill').value.trim(),
      bgGradient: $('heroGradient').value.trim()
    },
    offerBanners: collectOfferBanners()
  };
  try {
    const res = await fetch('/admin/settings?key=' + encodeURIComponent(getKey()), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ banners })
    });
    const data = await res.json();
    if (data.ok) { alert('✅ Banners saved!'); SETTINGS = data.settings; }
    else alert('Error: ' + (data.error||'Failed'));
  } catch(e) { alert('Network error'); }
}
</script>
</body>
</html>
