<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeatPe Admin — Orders</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d62828;
      --green: #16a34a;
      --orange: #f77f00;
      --blue: #2563eb;
      --gray: #6b7280;
      --light: #f3f4f6;
      --border: #e5e7eb;
      --dark: #1a1a1a;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--light); color: var(--dark);
      padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 {
      font-size: 24px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 12px;
    }
    h1 img { height: 36px; }
    .sub { color: var(--gray); margin-bottom: 20px; }
    .nav-links {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .nav-links a {
      padding: 8px 14px; background: white; border-radius: 8px;
      color: var(--gray); text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); transition: all .15s;
    }
    .nav-links a:hover { border-color: var(--primary); color: var(--primary); }
    .nav-links a.active { background: var(--primary); color: white; border-color: var(--primary); }

    .key-bar {
      background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 18px;
      display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      flex-wrap: wrap;
    }
    .key-bar label { font-weight: 600; font-size: 14px; }
    .key-bar input {
      flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: monospace;
    }
    .key-bar button {
      background: var(--primary); color: white; border: none; padding: 9px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .key-bar button.refresh { background: var(--blue); }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: white; padding: 16px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .stat .label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .stat .val { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .stat.primary .val { color: var(--primary); }
    .stat.green .val { color: var(--green); }
    .stat.orange .val { color: var(--orange); }
    .stat.blue .val { color: var(--blue); }

    .filter-bar {
      display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
      background: white; padding: 8px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .filter-chip {
      padding: 10px 18px; background: transparent; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      color: var(--gray); transition: all .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .filter-chip:hover { background: var(--light); color: var(--dark); }
    .filter-chip.active {
      background: var(--primary); color: white;
      box-shadow: 0 2px 8px rgba(214,40,40,.3);
    }
    .filter-chip .count {
      background: rgba(0,0,0,.08); color: inherit;
      font-size: 11px; font-weight: 700;
      min-width: 22px; height: 20px; padding: 0 7px;
      border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .filter-chip.active .count { background: rgba(255,255,255,.25); }

    .order {
      background: white; border-radius: 12px; margin-bottom: 14px;
      padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-left: 4px solid var(--gray);
    }
    .order.s-placed { border-color: var(--blue); }
    .order.s-preparing { border-color: var(--orange); }
    .order.s-out_for_delivery { border-color: #a855f7; }
    .order.s-delivered { border-color: var(--green); opacity: .82; }
    .order.s-cancelled { border-color: #ef4444; opacity: .65; }

    .order-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .order-id-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .order-id { font-size: 18px; font-weight: 700; }
    .order-time { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .source-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: .3px;
    }
    .source-badge.web      { background: #e0f2fe; color: #075985; }
    .source-badge.whatsapp { background: #d1fae5; color: #065f46; }
    .badge {
      display: inline-block; padding: 5px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px;
    }
    .badge.s-placed { background: #dbeafe; color: #1e40af; }
    .badge.s-preparing { background: #ffedd5; color: #9a3412; }
    .badge.s-out_for_delivery { background: #f3e8ff; color: #6b21a8; }
    .badge.s-delivered { background: #dcfce7; color: #14532d; }
    .badge.s-cancelled { background: #fee2e2; color: #991b1b; }

    .order-body {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px;
    }
    @media (max-width: 700px) {
      .order-body { grid-template-columns: 1fr; }
    }
    .order-customer { font-size: 14px; }
    .order-customer p { margin-bottom: 6px; line-height: 1.5; }
    .order-customer strong { color: var(--dark); }
    .order-customer .label-tag {
      color: var(--gray); font-size: 12px; text-transform: uppercase;
      letter-spacing: .3px; margin-right: 4px;
    }
    .call-row {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }
    .call-row a {
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      font-weight: 600; text-decoration: none; display: inline-flex; gap: 4px;
    }
    .call-row a.call { background: var(--blue); color: white; }
    .call-row a.wa { background: #25d366; color: white; }
    .call-row a.maps { background: var(--gray); color: white; }

    .quick-msg {
      margin-top: 10px; font-size: 12px;
      background: var(--light); border-radius: 8px;
      padding: 8px 12px;
    }
    .quick-msg summary {
      cursor: pointer; font-weight: 600; color: #16a34a;
      user-select: none; font-size: 12px;
    }
    .quick-msg-list {
      margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;
    }
    .quick-msg-list a {
      padding: 6px 10px; border-radius: 6px;
      background: white; color: var(--dark);
      text-decoration: none; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); transition: all .15s;
    }
    .quick-msg-list a:hover {
      background: #25d366; color: white; border-color: #25d366;
    }

    .order-items {
      background: var(--light); border-radius: 8px; padding: 12px 14px;
    }
    .item-row {
      display: flex; justify-content: space-between;
      padding: 4px 0; font-size: 13px;
    }
    .totals {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
      font-size: 13px;
    }
    .totals .row { display: flex; justify-content: space-between; padding: 2px 0; }
    .totals .row.total {
      font-size: 15px; font-weight: 700; color: var(--primary);
      border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px;
    }

    .actions {
      margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap;
      padding-top: 12px; border-top: 1px solid var(--border);
    }
    .btn {
      padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border);
      background: white; color: var(--dark); cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all .15s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.b-preparing { background: var(--orange); color: white; border-color: var(--orange); }
    .btn.b-out_for_delivery { background: #a855f7; color: white; border-color: #a855f7; }
    .btn.b-delivered { background: var(--green); color: white; border-color: var(--green); }
    .btn.b-cancelled { background: #ef4444; color: white; border-color: #ef4444; }
    .btn.b-preparing:hover, .btn.b-out_for_delivery:hover,
    .btn.b-delivered:hover, .btn.b-cancelled:hover { color: white; opacity: .9; }

    .empty {
      text-align: center; padding: 60px 20px; color: var(--gray);
      background: white; border-radius: 12px;
    }
    .empty .big { font-size: 56px; margin-bottom: 10px; }
    .err { background: #fee; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 14px; }

    .auto-refresh-toggle {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto; font-size: 13px; color: var(--gray);
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="/logo.png" alt="MeatPe" />Orders Dashboard</h1>
  <p class="sub">All incoming orders from website + WhatsApp.</p>

  <div class="nav-links">
    <a href="/admin.html">📦 Stock</a>
    <a href="/orders.html" class="active">📋 Orders</a>
    <a href="/items.html">🍗 Items</a>
    <a href="/coupons.html">🏷️ Coupons</a>
    <a href="/reviews.html">⭐ Reviews</a>
    <a href="/users.html">👥 Users</a>
    <a href="/settings.html">⚙️ Settings</a>
    <a href="/" target="_blank">🌐 View Site</a>
  </div>

  <div class="key-bar">
    <label>Admin key:</label>
    <input id="key" type="password" placeholder="Enter ADMIN_KEY" autocomplete="off" />
    <button id="loadBtn">Load orders</button>
    <button id="refreshBtn" class="refresh" style="display:none">↻ Refresh</button>
    <label class="auto-refresh-toggle"><input type="checkbox" id="autoRefresh" /> Auto-refresh (30s)</label>
  </div>

  <div id="msg"></div>
  <div id="stats" class="stats" style="display:none"></div>
  <div id="sourceBar" class="filter-bar" style="display:none;background:transparent;padding:0;box-shadow:none"></div>
  <div id="filters" class="filter-bar" style="display:none"></div>
  <div id="content"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const keyInput = $('key');
const content = $('content');
const msg = $('msg');
const statsEl = $('stats');
const filtersEl = $('filters');

let CURRENT_FILTER = 'placed'; // start on New Orders tab
let CURRENT_SOURCE = ''; // '', 'web', 'whatsapp'
let ALL_ORDERS = [];
let STATS_DATA = null;
let TODAY_DATA = null;
let autoTimer = null;

const STATUSES = [
  { key: 'placed',           label: '🆕 New Orders',     statKey: 'placed' },
  { key: 'preparing',        label: '👨‍🍳 Processing',     statKey: 'preparing' },
  { key: 'out_for_delivery', label: '🛵 Out for Delivery', statKey: 'out_for_delivery' },
  { key: 'delivered',        label: '✅ Delivered',       statKey: 'delivered' },
  { key: '',                 label: '📋 All',            statKey: 'total' },
];

// Restore key
const saved = localStorage.getItem('meatpe_admin_key');
if (saved) keyInput.value = saved;

$('loadBtn').addEventListener('click', () => loadOrders(true));
$('refreshBtn').addEventListener('click', () => loadOrders(false));
keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadOrders(true); });
$('autoRefresh').addEventListener('change', (e) => {
  if (e.target.checked) {
    autoTimer = setInterval(() => loadOrders(false), 30000);
  } else {
    clearInterval(autoTimer); autoTimer = null;
  }
});

if (saved) loadOrders(true);

async function loadOrders(showLoad) {
  msg.innerHTML = '';
  const key = keyInput.value.trim();
  if (!key) {
    msg.innerHTML = '<div class="err">Enter your admin key first.</div>';
    return;
  }
  localStorage.setItem('meatpe_admin_key', key);
  try {
    let url = `/admin/orders?key=${encodeURIComponent(key)}`;
    if (CURRENT_FILTER) url += `&status=${CURRENT_FILTER}`;
    if (CURRENT_SOURCE) url += `&source=${CURRENT_SOURCE}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    ALL_ORDERS = data.orders;
    STATS_DATA = data.stats;
    TODAY_DATA = data.today;
    render();
    $('refreshBtn').style.display = 'inline-block';
  } catch (e) {
    msg.innerHTML = `<div class="err">Failed: ${escapeHtml(e.message || 'unknown')}. Check the admin key.</div>`;
  }
}

function render() {
  // Stats
  if (STATS_DATA) {
    statsEl.style.display = 'grid';
    statsEl.innerHTML = `
      <div class="stat primary"><div class="label">Today's Orders</div><div class="val">${TODAY_DATA.count}</div></div>
      <div class="stat green"><div class="label">Today's Revenue</div><div class="val">₹${TODAY_DATA.revenue}</div></div>
      <div class="stat blue"><div class="label">Total Orders</div><div class="val">${STATS_DATA.total || 0}</div></div>
      <div class="stat orange"><div class="label">Total Revenue</div><div class="val">₹${STATS_DATA.revenue || 0}</div></div>
    `;
  }
  // Source filter chips
  const sourceBar = $('sourceBar');
  if (STATS_DATA) {
    sourceBar.style.display = 'flex';
    const totalAll = STATS_DATA.total || 0;
    const w = STATS_DATA.source_web || 0;
    const wa = STATS_DATA.source_whatsapp || 0;
    sourceBar.innerHTML = `
      <button class="filter-chip ${CURRENT_SOURCE === '' ? 'active' : ''}" data-src="">
        <span>📋 All Sources</span><span class="count">${totalAll}</span>
      </button>
      <button class="filter-chip ${CURRENT_SOURCE === 'web' ? 'active' : ''}" data-src="web">
        <span>🌐 Web</span><span class="count">${w}</span>
      </button>
      <button class="filter-chip ${CURRENT_SOURCE === 'whatsapp' ? 'active' : ''}" data-src="whatsapp">
        <span>💬 WhatsApp</span><span class="count">${wa}</span>
      </button>
    `;
    sourceBar.querySelectorAll('.filter-chip').forEach(c => {
      c.addEventListener('click', () => {
        CURRENT_SOURCE = c.dataset.src;
        loadOrders(false);
      });
    });
  }

  // Filters with live counts
  filtersEl.style.display = 'flex';
  filtersEl.innerHTML = STATUSES.map(s => {
    const count = STATS_DATA ? (STATS_DATA[s.statKey] || 0) : 0;
    return `<button class="filter-chip ${CURRENT_FILTER === s.key ? 'active' : ''}" data-status="${s.key}">
      <span>${s.label}</span><span class="count">${count}</span>
    </button>`;
  }).join('');
  filtersEl.querySelectorAll('.filter-chip').forEach(c => {
    c.addEventListener('click', () => {
      CURRENT_FILTER = c.dataset.status;
      loadOrders(false);
    });
  });

  // Orders
  if (!ALL_ORDERS.length) {
    content.innerHTML = `<div class="empty"><div class="big">📋</div><p>No orders yet${CURRENT_FILTER ? ' in this status' : ''}.</p></div>`;
    return;
  }
  content.innerHTML = ALL_ORDERS.map(renderOrder).join('');
  content.querySelectorAll('[data-action="status"]').forEach(btn => {
    btn.addEventListener('click', () => updateStatus(btn.dataset.id, btn.dataset.status));
  });
}

function renderOrder(o) {
  const phoneClean = (o.phone || '').replace(/^whatsapp:\+?/, '').replace(/\D/g, '');
  const ts = formatTime(o.created_at);
  const items = (o.items || []).map(i =>
    `<div class="item-row"><span>${escapeHtml(i.name)} × ${i.qty}</span><span>₹${i.price * i.qty}</span></div>`
  ).join('');
  const statusActions = renderStatusActions(o);
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address || '')}`;

  // Pre-built customer message templates for one-click WhatsApp
  const itemsList = (o.items || []).map(i => `${i.name} × ${i.qty}`).join('\n');
  const tplConfirm = `Hi ${o.name || ''}, your MeatPe order #${o.id} is confirmed ✅\n\n${itemsList}\n\nTotal: ₹${o.total}\nETA: ~30 min 🛵\n\n— MeatPe`;
  const tplPreparing = `Hi ${o.name || ''}, your MeatPe order #${o.id} is being prepared 👨‍🍳 — fresh cleaning + cutting in progress.\n\n— MeatPe`;
  const tplOnWay = `Hi ${o.name || ''}, your MeatPe order #${o.id} is on the way 🛵 — please keep ₹${o.total} ready.\n\n— MeatPe`;
  const tplDelivered = `Hi ${o.name || ''}, your MeatPe order #${o.id} has been delivered ✅. Thank you!\n\nIf any issue, reply within 2 hours with a photo.\n\n— MeatPe`;
  const waLink = (text) => `https://wa.me/${phoneClean}?text=${encodeURIComponent(text)}`;

  return `
    <div class="order s-${o.status}">
      <div class="order-head">
        <div class="order-id-row">
          <div>
            <div class="order-id">Order #${o.id}</div>
            <div class="order-time">${ts}</div>
          </div>
          <span class="source-badge ${o.source}">${o.source === 'whatsapp' ? '💬 WhatsApp' : '🌐 Web'}</span>
        </div>
        <div class="badge s-${o.status}">${o.status.replace(/_/g, ' ')}</div>
      </div>
      <div class="order-body">
        <div class="order-customer">
          <p><span class="label-tag">Name</span><strong>${escapeHtml(o.name || 'Customer')}</strong></p>
          <p><span class="label-tag">Phone</span>+${phoneClean}</p>
          <p><span class="label-tag">Address</span>${escapeHtml(o.address || '-')}</p>
          <div class="call-row">
            <a href="tel:+${phoneClean}" class="call">📞 Call</a>
            <a href="https://wa.me/${phoneClean}" target="_blank" class="wa">💬 WhatsApp</a>
            <a href="${mapsUrl}" target="_blank" class="maps">📍 Map</a>
          </div>
          <details class="quick-msg">
            <summary>📨 Quick WhatsApp templates</summary>
            <div class="quick-msg-list">
              <a href="${waLink(tplConfirm)}" target="_blank">✅ Confirm Order</a>
              <a href="${waLink(tplPreparing)}" target="_blank">👨‍🍳 Preparing</a>
              <a href="${waLink(tplOnWay)}" target="_blank">🛵 Out for Delivery</a>
              <a href="${waLink(tplDelivered)}" target="_blank">✅ Delivered</a>
            </div>
          </details>
        </div>
        <div class="order-items">
          ${items}
          <div class="totals">
            <div class="row"><span>Subtotal</span><span>₹${o.subtotal}</span></div>
            <div class="row"><span>Delivery</span><span>${o.delivery_fee === 0 ? 'FREE' : '₹' + o.delivery_fee}</span></div>
            <div class="row total"><span>Total</span><span>₹${o.total}</span></div>
          </div>
        </div>
      </div>
      ${statusActions ? `<div class="actions">${statusActions}</div>` : ''}
    </div>`;
}

function renderStatusActions(o) {
  const flow = {
    placed: ['preparing', 'cancelled'],
    preparing: ['out_for_delivery', 'cancelled'],
    out_for_delivery: ['delivered', 'cancelled'],
    delivered: [],
    cancelled: [],
  };
  const next = flow[o.status] || [];
  if (!next.length) return '';
  const labels = {
    preparing: '👨‍🍳 Mark Preparing',
    out_for_delivery: '🛵 Send for Delivery',
    delivered: '✅ Delivered',
    cancelled: '❌ Cancel',
  };
  return next.map(s => `<button class="btn b-${s}" data-action="status" data-id="${o.id}" data-status="${s}">${labels[s]}</button>`).join('');
}

async function updateStatus(id, status) {
  const key = keyInput.value.trim();
  try {
    const res = await fetch(`/admin/orders/${id}/status?key=${encodeURIComponent(key)}&status=${status}`, { method: 'POST' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'update failed');
    loadOrders(false);
  } catch (e) {
    msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
    setTimeout(() => msg.innerHTML = '', 3000);
  }
}

function formatTime(s) {
  if (!s) return '';
  // SQLite returns UTC; show in local time
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
