<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeatPe Admin — Returns & Refunds</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d62828;
      --green: #16a34a;
      --orange: #f77f00;
      --red: #ef4444;
      --gray: #6b7280;
      --light: #f3f4f6;
      --border: #e5e7eb;
      --dark: #1a1a1a;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--light); color: var(--dark); padding: 20px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    h1 img { height: 36px; }
    .sub { color: var(--gray); margin-bottom: 20px; }
    .nav-links { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-links a {
      padding: 8px 14px; background: white; border-radius: 8px;
      color: var(--gray); text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); transition: all .15s;
    }
    .nav-links a:hover { border-color: var(--primary); color: var(--primary); }
    .nav-links a.active { background: var(--primary); color: white; border-color: var(--primary); }
    .key-bar {
      background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 18px;
      display: flex; gap: 10px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      flex-wrap: wrap;
    }
    .key-bar label { font-weight: 600; font-size: 14px; }
    .key-bar input {
      flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: monospace;
    }
    .key-bar button {
      background: var(--primary); color: white; border: none; padding: 9px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 18px;
    }
    .stat {
      background: white; padding: 16px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .stat .label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .stat .val { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .stat.primary .val { color: var(--primary); }
    .stat.orange .val { color: var(--orange); }
    .stat.green .val { color: var(--green); }
    .stat.red .val { color: var(--red); }

    .return-card {
      background: white; border-radius: 12px; margin-bottom: 14px;
      padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-left: 4px solid var(--orange);
    }
    .return-card.status-requested { border-color: var(--orange); }
    .return-card.status-approved { border-color: var(--green); }
    .return-card.status-rejected { border-color: var(--red); }
    .return-card.status-refunded { border-color: var(--primary); }
    
    .return-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .return-id { font-size: 16px; font-weight: 700; }
    .return-time { font-size: 12px; color: var(--gray); margin-top: 2px; }
    .badge {
      display: inline-block; padding: 5px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    }
    .badge.requested { background: #ffedd5; color: #9a3412; }
    .badge.approved { background: #dcfce7; color: #14532d; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }
    .badge.refunded { background: #dbeafe; color: #1e40af; }
    
    .return-body {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      margin-top: 12px;
    }
    @media (max-width: 700px) {
      .return-body { grid-template-columns: 1fr; }
    }
    .return-info { font-size: 14px; }
    .return-info p { margin-bottom: 8px; line-height: 1.5; }
    .return-info strong { color: var(--dark); }
    .return-info .label { color: var(--gray); font-size: 12px; text-transform: uppercase; margin-right: 4px; }
    .return-reason {
      background: var(--light); padding: 12px; border-radius: 8px;
      font-size: 14px; line-height: 1.6;
    }
    .return-items {
      margin-top: 10px; padding: 10px; background: var(--light); border-radius: 8px;
      font-size: 13px;
    }
    .return-items div { padding: 4px 0; }
    .empty {
      text-align: center; padding: 60px 20px; color: var(--gray);
      background: white; border-radius: 12px;
    }
    .empty .big { font-size: 56px; margin-bottom: 10px; }
    .err { background: #fee; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
    
    .actions {
      margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;
      padding-top: 12px; border-top: 1px solid var(--border);
    }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .btn.approve { background: var(--green); color: white; }
    .btn.approve:hover { opacity: .9; }
    .btn.reject { background: var(--red); color: white; }
    .btn.reject:hover { opacity: .9; }
    .btn.refund { background: var(--primary); color: white; }
    .btn.refund:hover { opacity: .9; }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="/logo.png" alt="MeatPe" />Returns & Refunds</h1>
  <p class="sub">All return and refund requests from customers.</p>

  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <a href="/dashboard.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📊 Dashboard</a>
    <a href="/admin.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📦 Stock</a>
    <a href="/orders.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">📋 Orders</a>
    <a href="/items.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🍗 Items</a>
    <a href="/coupons.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🏷️ Coupons</a>
    <a href="/reviews.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">⭐ Reviews</a>
    <a href="/returns.html" style="padding:8px 14px;background:#d62828;color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;border-color:#d62828">↩️ Returns</a>
    <a href="/users.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">👥 Users</a>
    <a href="/tickets.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🎫 Tickets</a>
    <a href="/delivery.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🚚 Delivery</a>
    <a href="/delivery-boys.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🛵 Riders</a>
    <a href="/settings.html" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">⚙️ Settings</a>
    <a href="/" target="_blank" style="padding:8px 14px;background:white;border-radius:8px;color:#6b7280;text-decoration:none;font-size:13px;font-weight:600;border:1px solid #e5e7eb">🌐 View Site</a>
  </div>

  <div class="key-bar">
    <label>Admin key:</label>
    <input id="key" type="password" placeholder="Enter ADMIN_KEY" autocomplete="off" />
    <button id="loadBtn">Load returns</button>
  </div>

  <div id="msg"></div>
  <div id="stats" class="stats" style="display:none"></div>
  <div id="content"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const keyInput = $('key');
const content = $('content');
const msg = $('msg');
const statsEl = $('stats');

let ALL_RETURNS = [];

const saved = localStorage.getItem('meatpe_admin_key');
if (saved) keyInput.value = saved;

$('loadBtn').addEventListener('click', loadReturns);
keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadReturns(); });
if (saved) loadReturns();

async function loadReturns() {
  msg.innerHTML = '';
  const key = keyInput.value.trim();
  if (!key) {
    msg.innerHTML = '<div class="err">Enter your admin key first.</div>';
    return;
  }
  localStorage.setItem('meatpe_admin_key', key);
  try {
    const res = await fetch(`/admin/returns?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'load failed');
    ALL_RETURNS = data.returns;
    render();
  } catch (e) {
    msg.innerHTML = `<div class="err">Failed: ${escapeHtml(e.message || 'unknown')}. Check the admin key.</div>`;
  }
}

function render() {
  // Stats
  const totalReturns = ALL_RETURNS.length;
  const requested = ALL_RETURNS.filter(r => r.status === 'requested').length;
  const approved = ALL_RETURNS.filter(r => r.status === 'approved').length;
  const rejected = ALL_RETURNS.filter(r => r.status === 'rejected').length;
  const refunded = ALL_RETURNS.filter(r => r.status === 'refunded').length;

  statsEl.style.display = 'grid';
  statsEl.innerHTML = `
    <div class="stat primary"><div class="label">Total Returns</div><div class="val">${totalReturns}</div></div>
    <div class="stat orange"><div class="label">Requested</div><div class="val">${requested}</div></div>
    <div class="stat green"><div class="label">Approved</div><div class="val">${approved}</div></div>
    <div class="stat red"><div class="label">Rejected</div><div class="val">${rejected}</div></div>
  `;

  // Returns
  if (!ALL_RETURNS.length) {
    content.innerHTML = `<div class="empty"><div class="big">↩️</div><p>No return requests yet.</p></div>`;
    return;
  }

  content.innerHTML = ALL_RETURNS.map(renderReturn).join('');
  
  // Add event listeners for action buttons
  content.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const id = parseInt(btn.dataset.id, 10);
      handleAction(id, action);
    });
  });
}

function renderReturn(r) {
  const phoneClean = (r.phone || '').replace(/\D/g, '');
  const ts = formatTime(r.created_at);
  const items = r.items || [];
  const itemsList = items.length > 0 
    ? items.map(i => `<div>• ${escapeHtml(i.name || i.code)} × ${i.qty}</div>`).join('')
    : '<div>All items</div>';

  // Action buttons based on status
  let actions = '';
  if (r.status === 'requested') {
    actions = `
      <div class="actions">
        <button class="btn approve" data-action="approve" data-id="${r.id}">✓ Approve Return</button>
        <button class="btn reject" data-action="reject" data-id="${r.id}">✗ Reject Return</button>
      </div>`;
  } else if (r.status === 'approved') {
    actions = `
      <div class="actions">
        <button class="btn refund" data-action="refund" data-id="${r.id}">₹ Mark as Refunded</button>
      </div>`;
  }

  return `
    <div class="return-card status-${r.status}">
      <div class="return-head">
        <div>
          <div class="return-id">Return Request #${r.id} (Order #${r.order_id})</div>
          <div class="return-time">${ts}</div>
        </div>
        <div class="badge ${r.status}">${r.status}</div>
      </div>
      <div class="return-body">
        <div class="return-info">
          <p><span class="label">Customer</span><strong>${escapeHtml(r.customer_name || 'Customer')}</strong></p>
          <p><span class="label">Phone</span>+${phoneClean}</p>
          <p><span class="label">Reason</span><strong>${escapeHtml(r.reason || 'N/A')}</strong></p>
          <p><span class="label">Order Total</span>₹${r.order_total || 0}</p>
          ${r.refund_amount ? `<p><span class="label">Refund Amount</span><strong style="color:var(--green)">₹${r.refund_amount}</strong></p>` : ''}
          ${r.refund_method ? `<p><span class="label">Refund Method</span>${escapeHtml(r.refund_method)}</p>` : ''}
          <div class="return-items">
            <strong>Items:</strong>
            ${itemsList}
          </div>
        </div>
        <div class="return-reason">
          <strong>Description:</strong><br/>
          ${escapeHtml(r.description || 'No description provided.')}
          ${r.admin_note ? `<br/><br/><strong>Admin Note:</strong><br/>${escapeHtml(r.admin_note)}` : ''}
        </div>
      </div>
      ${actions}
    </div>`;
}

async function handleAction(id, action) {
  const key = keyInput.value.trim();
  let status, refund_amount, refund_method, admin_note;
  
  if (action === 'approve') {
    status = 'approved';
    admin_note = 'Return approved by admin';
  } else if (action === 'reject') {
    const reason = prompt('Rejection reason (optional):');
    status = 'rejected';
    admin_note = reason || 'Return rejected by admin';
  } else if (action === 'refund') {
    const amount = prompt('Refund amount (₹):');
    const method = prompt('Refund method (UPI/Bank/Wallet):', 'UPI');
    if (!amount || isNaN(amount)) {
      msg.innerHTML = '<div class="err">Invalid refund amount.</div>';
      setTimeout(() => msg.innerHTML = '', 3000);
      return;
    }
    status = 'refunded';
    refund_amount = parseInt(amount, 10);
    refund_method = method || 'UPI';
    admin_note = `Refund of ₹${refund_amount} via ${refund_method}`;
  }
  
  try {
    const res = await fetch(`/admin/returns/${id}/status?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, refund_amount, refund_method, admin_note })
    });
    
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'update failed');
    
    // Reload returns
    loadReturns();
  } catch (e) {
    msg.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
    setTimeout(() => msg.innerHTML = '', 3000);
  }
}

function formatTime(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
